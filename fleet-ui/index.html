<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f6f4" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e2f7f1'/%3E%3Cpath d='M8 10h11M8 16h14M8 22h11' fill='none' stroke='%23087765' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>SYMMIO Fleet</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("fleet-theme");
        const theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
