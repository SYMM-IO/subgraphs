"""
Normalized account profile for a PartyA-style address.

This entity covers legacy MultiAccount accounts, direct core PartyA addresses,
account-layer sub-accounts, and account-layer virtual accounts. Use
`accountKind`, `isVirtual`, `subAccount`, and `virtualAccount` to distinguish
the account-layer shape.
"""
type Account @entity(immutable: false) {
	"""
	Lowercase hex address string for the indexed account.
	"""
	id: ID!
	"""
	Contract assigned by creation or selected core handlers; it may change and does not identify every latest writer.
	"""
	source: Bytes
	"""
	Deployment identifier derived by profile helpers when available.
	"""
	deploymentId: String
	"""
	Symmio core contract associated with this account when known.
	"""
	coreSource: Bytes
	"""
	AccountLayer contract associated with this account when known.
	"""
	accountLayerSource: Bytes
	"""
	Account address represented by this profile.
	"""
	account: Bytes!
	"""
	Account shape label set by handlers, such as sub-account or virtual-account.
	"""
	accountKind: String
	"""
	Monotonic indexer-side ordering counter assigned by this subgraph.
	"""
	globalCounter: BigInt!
	"""
	User attribution: wallet owner for AccountLayer profiles and commonly the represented address for direct/protocol actors.
	"""
	user: Bytes!
	"""
	User entity for `user`.
	"""
	userRef: User
	"""
	Owner address for account-layer profiles; usually the same wallet as `user`.
	"""
	owner: Bytes
	"""
	Timestamp assigned by latest full account-builder initialization; replace-on-existing flows can overwrite it.
	"""
	timestamp: BigInt!
	"""
	Block assigned by full initialization or selected handlers; not every profile update.
	"""
	blockNumber: BigInt!
	"""
	Human-readable account name from account creation or edit events.
	"""
	name: String
	"""
	Coarse classification: NORMAL, SOLVER, LIQUIDATOR, BRIDGE, or UNKNOWN; accountKind describes hierarchy shape.
	"""
	type: String
	"""
	Latest timestamp of any activity attributed to this account.
	"""
	lastActivityTimestamp: BigInt!
	"""
	Transaction assigned by latest full account-builder initialization; not guaranteed original creation.
	"""
	transaction: Bytes!
	"""
	Latest timestamp of profile-level changes to this account.
	"""
	updateTimestamp: BigInt!
	"""
	Affiliate, MultiAccount, or account-source address used for attribution.
	"""
	accountSource: Bytes
	"""
	Currently unused nullable relation; no handler derives it from accountSource.
	"""
	affiliateRef: Affiliate
	"""
	Number of quotes attributed to this account by analytics handlers.
	"""
	quotesCount: BigInt!
	"""
	Number of positions attributed to this account by analytics handlers.
	"""
	positionsCount: BigInt!
	"""
	Cumulative deposits attributed to this account.
	"""
	deposit: BigInt!
	"""
	Cumulative withdrawals attributed to this account.
	"""
	withdraw: BigInt!
	"""
	Cumulative allocate amount attributed to this account.
	"""
	allocated: BigInt!
	"""
	Cumulative deallocate amount attributed to this account.
	"""
	deallocated: BigInt!
	"""
	Parent sub-account address for virtual-account profiles.
	"""
	parentAddress: Bytes
	"""
	True when this Account row represents an account-layer virtual account.
	"""
	isVirtual: Boolean
	"""
	Affiliate/account-source address used to attribute this account.
	"""
	affiliate: Bytes
	"""
	SubAccount entity id for account-layer profiles.
	"""
	subAccount: SubAccount
	"""
	VirtualAccount entity id when this profile represents or is routed through a VA.
	"""
	virtualAccount: VirtualAccount
	"""
	Reserved field; no current perps handler assigns it.
	"""
	lastCoreActivityTimestamp: BigInt
	"""
	Latest selected AccountLayer create, delete, reuse, import, or ownership-transfer timestamp; not all layer activity.
	"""
	lastLayerActivityTimestamp: BigInt
	"""
	Reserved field; no current perps handler assigns it.
	"""
	lastBalanceActivityTimestamp: BigInt
	"""
	Deletion flag set by account-layer delete/reuse handlers.
	"""
	isDeleted: Boolean
}
