type Account @entity(immutable: false) {
	id: ID!
	source: Bytes
	account: Bytes!
	globalCounter: BigInt!
	user: Bytes!
	timestamp: BigInt!
	blockNumber: BigInt!
	name: String
	type: String
	lastActivityTimestamp: BigInt!
	transaction: Bytes!
	updateTimestamp: BigInt!
	accountSource: Bytes
	quotesCount: BigInt!
	positionsCount: BigInt!
	deposit: BigInt!
	withdraw: BigInt!
	allocated: BigInt!
	deallocated: BigInt!
	parentAddress: Bytes
	isVirtual: Boolean
	affiliate: Bytes
	subAccount: SubAccount
	virtualAccount: VirtualAccount
}
