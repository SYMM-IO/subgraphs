"""
Named Symmio-related address metadata stored by SetEntityMetadata handling.
"""
type SymmioEntity @entity(immutable: false) {
	"""
	Lowercase hexadecimal address used as the entity id.
	"""
	id: ID!
	"""
	Entity address.
	"""
	address: Bytes!
	"""
	Indexer-derived Solver, Affiliate, or Unknown classification from configured sets or affiliate handlers.
	"""
	type: String!
	"""
	Optional display name.
	"""
	name: String
	"""
	Optional brand color.
	"""
	brandColor: String
	"""
	Optional raw metadata string.
	"""
	metadata: String
}
