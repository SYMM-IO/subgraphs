type MarginTransfer @entity(immutable: true) {
	id: ID!
	type: String!
	virtualAccount: VirtualAccount!
	subAccount: SubAccount!
	amount: BigInt!
	source: Bytes!
	deploymentId: String
	coreSource: Bytes
	accountLayerSource: Bytes
	timestamp: BigInt!
	blockNumber: BigInt!
	transaction: Bytes!
	virtualAccountRef: VirtualAccount
	subAccountRef: SubAccount
}
