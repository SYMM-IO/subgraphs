"""
Immutable AccountLayer margin movement between a sub-account and virtual account.

`type` is written by the AccountLayer margin handlers and is currently used for
ADD, REMOVE, and EMERGENCY_RECOVER flows. Balances on SubAccount/VirtualAccount
are subgraph-maintained latest balances, not a complete replacement for core
balance reads.
"""
type MarginTransfer @entity(immutable: true) {
	"""
	Event id `${transactionHash}-${logIndex}`.
	"""
	id: ID!
	"""
	Monotonic indexer-side ordering counter assigned when this row is created. Use for stable chronological sort across event sources.
	"""
	globalCounter: BigInt!
	"""
	Margin movement type label written by the handler.
	"""
	type: String!
	"""
	Virtual account involved in the margin movement.
	"""
	virtualAccount: VirtualAccount!
	"""
	Parent sub-account involved in the margin movement.
	"""
	subAccount: SubAccount!
	"""
	18-decimal core margin moved between the parent SubAccount and VirtualAccount.
	"""
	amount: BigInt!
	"""
	AccountLayer contract address that emitted the margin event.
	"""
	source: Bytes!
	"""
	Deployment identifier derived by profile helpers when available.
	"""
	deploymentId: String
	"""
	Symmio core associated with the account hierarchy when known.
	"""
	coreSource: Bytes
	"""
	AccountLayer contract associated with the account hierarchy.
	"""
	accountLayerSource: Bytes
	"""
	Block timestamp of the margin event.
	"""
	timestamp: BigInt!
	"""
	Block number of the margin event.
	"""
	blockNumber: BigInt!
	"""
	Transaction hash of the margin event.
	"""
	transaction: Bytes!
	"""
	Nullable alias of virtualAccount assigned to the same entity ID; resolution depends on target existence.
	"""
	virtualAccountRef: VirtualAccount
	"""
	Nullable alias of subAccount assigned to the same entity ID; resolution depends on target existence.
	"""
	subAccountRef: SubAccount
}
