"""
Normalized lifecycle state for a SYMMIO quote.

A quote starts as a PartyA trade request and is updated as events move it
through lock, open, close, cancel, expiry, funding, and liquidation flows.
The entity id is `${quoteId}-${coreAddress}` so the same numeric quote id on
different Symmio core contracts does not collide.

Numeric enum fields mirror Solidity enum ordinals from `QuoteStorage.sol`:
`positionType` is 0 LONG, 1 SHORT; `orderTypeOpen` and `orderTypeClose` are
0 LIMIT, 1 MARKET; `quoteStatus` is the raw `QuoteStatus` ordinal.
Unless a field says otherwise, BigInt values are raw contract values.
"""
type Quote @entity(immutable: false) {
	"""
	Composite quote id `${quoteId}-${coreAddress}`.
	"""
	id: String!
	"""
	Symmio core contract address that emitted the indexed event.
	"""
	source: Bytes!
	"""
	Global ordering value assigned by the latest lifecycle handler that rewrote this quote; not a stable creation index.
	"""
	globalCounter: BigInt!
	"""
	Protocol quote id from the Symmio core contract.
	"""
	quoteId: BigInt!
	"""
	Raw QuoteStatus ordinal: 0 PENDING, 1 LOCKED, 2 CANCEL_PENDING, 3 CANCELED, 4 OPENED, 5 CLOSE_PENDING, 6 CANCEL_CLOSE_PENDING, 7 CLOSED, 8 LIQUIDATED, 9 EXPIRED, 10 LIQUIDATED_PENDING.
	"""
	quoteStatus: Int
	"""
	PartyA read from SendQuote or quote storage; failed legacy catch-up currently substitutes the core address.
	"""
	partyA: Bytes!
	"""
	PartyB address once the quote is locked/opened by a solver.
	"""
	partyB: Bytes
	"""
	Subgraph affiliate/account-source attribution; not always the raw core quote affiliate.
	"""
	affiliate: Bytes
	"""
	Account-layer sub-account associated with this quote, when known.
	"""
	subAccount: SubAccount
	"""
	Account-layer virtual account associated with this quote, when known.
	"""
	virtualAccount: VirtualAccount
	"""
	Normalized account entity for PartyA or the account-layer PartyA address.
	"""
	partyAAccount: Account
	"""
	Last lifecycle action label written by the handler that updated the quote.
	"""
	action: String
	"""
	Block number of the last event that updated this quote.
	"""
	blockNumber: BigInt!

	"""
	Requested opening price, scaled by 1e18.
	"""
	requestedOpenPrice: BigInt
	"""
	Market-order validation price captured at quote creation, scaled by 1e18.
	"""
	marketPrice: BigInt
	"""
	Raw Solidity `OrderType` ordinal for the open request.
	"""
	orderTypeOpen: Int
	"""
	Current 1e18-scaled quote quantity: requested while pending and reduced to opened fill after a partial split.
	"""
	quantity: BigInt
	"""
	Current CVA locked value in 18-decimal internal collateral precision.
	"""
	cva: BigInt
	"""
	Current liquidation-fee locked value in 18-decimal internal collateral precision.
	"""
	lf: BigInt
	"""
	Current PartyB maintenance margin in 18-decimal internal collateral precision.
	"""
	partyBmm: BigInt
	"""
	Current PartyA maintenance margin in 18-decimal internal collateral precision.
	"""
	partyAmm: BigInt
	"""
	Symbol id from the quote.
	"""
	symbolId: BigInt
	"""
	Symbol name resolved from the core symbol registry when available.
	"""
	symbol: String
	"""
	Raw Solidity `PositionType` ordinal: 0 LONG, 1 SHORT.
	"""
	positionType: Int
	"""
	Open deadline copied from the quote deadline.
	"""
	openDeadline: BigInt
	"""
	PartyB whitelist submitted with the quote.
	"""
	partyBsWhiteList: [Bytes!]
	"""
	Maximum funding rate in 1e18 precision; older cores called it max interest rate.
	"""
	maxFundingRate: BigInt

	"""
	Most recently handled filled quantity, scaled by 1e18.
	"""
	fillAmount: BigInt
	"""
	Current 1e18-scaled opened-price basis, adjusted by funding and restatement handling.
	"""
	openedPrice: BigInt
	"""
	Open-fee rate in 1e18 precision, where 1e18 is 100%; zero when older cores omitted it.
	"""
	tradingFee: BigInt!
	"""
	Close-fee rate in 1e18 precision, where 1e18 is 100%; zero for older core versions.
	"""
	closeFee: BigInt!

	"""
	Creation/catch-up copy of the 1e18-scaled opened-price basis; not continuously synchronized.
	"""
	initialOpenedPrice: BigInt
	"""
	Creation/catch-up copy of CVA in 18-decimal internal precision; normally from SendQuote.
	"""
	initialCva: BigInt!
	"""
	Creation/catch-up copy of PartyA MM in 18-decimal internal precision; normally from SendQuote.
	"""
	initialPartyAmm: BigInt
	"""
	Creation/catch-up copy of PartyB MM in 18-decimal internal precision; normally from SendQuote.
	"""
	initialPartyBmm: BigInt!
	"""
	Creation/catch-up copy of LF in 18-decimal internal precision; normally from SendQuote.
	"""
	initialLf: BigInt!

	"""
	Requested close price, scaled by 1e18.
	"""
	closePrice: BigInt
	"""
	Raw Solidity `OrderType` ordinal for the close request.
	"""
	orderTypeClose: Int
	"""
	Most recent 1e18-scaled close price from fill-close, force-close, emergency-close, or ADL handling.
	"""
	closedPrice: BigInt
	"""
	Close request deadline.
	"""
	closeDeadline: BigInt
	"""
	Requested close quantity, scaled by 1e18.
	"""
	quantityToClose: BigInt
	"""
	Close request id emitted by close-request events.
	"""
	closeId: BigInt

	"""
	Cumulative quantity closed or liquidated, scaled by 1e18.
	"""
	closedAmount: BigInt
	"""
	Unused reserved analytics field; no current perps handler assigns it.
	"""
	leverage: BigInt
	"""
	Average closed price in 1e18 precision.
	"""
	averageClosedPrice: BigInt

	"""
	Derived 1e18-scaled execution price for quantity closed by liquidation handlers; not ADL or force close.
	"""
	liquidatePrice: BigInt
	"""
	Quantity closed by liquidation handlers, scaled by 1e18.
	"""
	liquidateAmount: BigInt
	"""
	Liquidated side written by liquidation handlers: 0 for PartyA, 1 for PartyB.
	"""
	liquidatedSide: Int
	"""
	Liquidation id from PartyA liquidation state when present.
	"""
	liquidationId: Bytes

	"""
	Indexer-derived cumulative PartyA funding debit in 18-decimal internal collateral precision.
	"""
	userPaidFunding: BigInt
	"""
	Indexer-derived cumulative PartyA funding credit in 18-decimal internal collateral precision.
	"""
	userReceivedFunding: BigInt
	"""
	Signed cumulative per-unit funding checkpoint scaled by 1e18.
	"""
	accumulatedPaidFunding: BigInt
	"""
	Last funding payment timestamp from quote storage.
	"""
	lastFundingPaymentTimestamp: BigInt
	"""
	Latest symbol-adjustment restatement epoch applied to this quote.
	"""
	lastAdjustmentEpoch: BigInt
	"""
	Latest 1e18-scaled symbol-adjustment factor applied to this quote.
	"""
	lastAdjustmentFactor: BigInt

	"""
	Block timestamp of the last event that updated this quote.
	"""
	timestamp: BigInt!
	"""
	SendQuote timestamp when indexed; catch-up-created rows use AcceptCancelRequest timestamp.
	"""
	timestampSendQuote: BigInt
	"""
	Block timestamp of the OpenPosition event.
	"""
	timestampOpenPosition: BigInt
	"""
	First indexed timestamp at which quoteStatus was CLOSED (7) or LIQUIDATED (8).
	"""
	timestampFullyClose: BigInt

	"""
	Lifecycle events whose `quote` relation points to this Quote.
	"""
	quoteEvents: [QuoteEvent!]! @derivedFrom(field: "quote")
	"""
	Derived funding realizations whose `quote` relation points to this Quote.
	"""
	fundingSettlements: [QuoteFundingSettlement!]! @derivedFrom(field: "quote")
}

"""
Unused legacy PartyA liquidation helper retained for schema compatibility; no current perps handler creates or updates this entity.
"""
type PartyA @entity(immutable: false) {
	"""
	Unused legacy entity key; no current writer assigns it.
	"""
	id: String!
	"""
	Unused legacy PartyB field; no current writer assigns it.
	"""
	partyB: Bytes
	"""
	Unused legacy pending-quote list; no current writer assigns it.
	"""
	quoteUntilLiquid: [BigInt!]
	"""
	Unused legacy ordering field; no current writer assigns it.
	"""
	globalCounter: BigInt!
}

"""
Unused legacy PartyB/PartyA liquidation helper retained for schema compatibility; no current perps handler creates or updates this entity.
"""
type PartyBPartyA @entity(immutable: false) {
	"""
	Unused legacy entity key; no current writer assigns it.
	"""
	id: String!
	"""
	Unused legacy PartyB field; no current writer assigns it.
	"""
	partyB: Bytes
	"""
	Unused legacy pending-quote list; no current writer assigns it.
	"""
	quoteUntilLiquid: [BigInt!]
	"""
	Unused legacy ordering field; no current writer assigns it.
	"""
	globalCounter: BigInt!
}

"""
Mutable index of pending quote ids for a PartyA / optional PartyB bucket.
"""
type PendingQuoteIndex @entity(immutable: false) {
	"""
	Composite id `${source}-${partyA}` or `${source}-${partyA}-${partyB}` for this pending quote bucket.
	"""
	id: ID!
	"""
	Symmio core contract address that owns the pending quote ids.
	"""
	source: Bytes!
	"""
	PartyA address whose pending quote ids are indexed in this bucket.
	"""
	partyA: Bytes!
	"""
	Optional PartyB address when the pending quote bucket is narrowed by solver.
	"""
	partyB: Bytes
	"""
	Protocol quote ids currently pending for this source/PartyA(/PartyB) bucket.
	"""
	quoteIds: [BigInt!]!
}

"""
Unused legacy PartyA/symbol price sample retained for schema compatibility; no current perps handler creates or updates this entity.
"""
type PartyASymbolPrice @entity(immutable: false) {
	"""
	Unused legacy entity key; no current writer assigns it.
	"""
	id: String!
	"""
	Unused legacy PartyA field; no current writer assigns it.
	"""
	partyA: Bytes!
	"""
	Unused legacy symbol field; no current writer assigns it.
	"""
	symbolId: BigInt!
	"""
	Unused legacy requested-price field; no current writer assigns it.
	"""
	requestedOpenPrice: BigInt!
	"""
	Unused legacy timestamp field; no current writer assigns it.
	"""
	timeStamp: BigInt!
	"""
	Unused legacy transaction field; no current writer assigns it.
	"""
	trHash: Bytes!
	"""
	Unused legacy ordering field; no current writer assigns it.
	"""
	GlobalCounter: BigInt!
}

"""
Indexer-derived net PartyA funding flow accumulated from successfully processed ChargeFundingRate entries.
"""
type GlobalFee @entity(immutable: false) {
	"""
	Singleton id, currently `GlobalEntity`.
	"""
	id: ID!
	"""
	Net PartyA funding received minus funding paid; this is not a protocol-fee total.
	"""
	globalFee: BigInt!
	"""
	Block timestamp of the latest ChargeFundingRate entry that updated this accumulator.
	"""
	latestTimestamp: BigInt!
}
