"""
AccountLayer affiliate / account manager profile.

Affiliates register with AccountLayer, can be approved, paused, or unpaused,
and are associated with sub-accounts that retain separate wallet owners. This
entity stores affiliate metadata and fee/share configuration observed by the subgraph.
"""
type Affiliate @entity(immutable: false) {
	"""
	Lowercase hex address string for the affiliate/account manager.
	"""
	id: ID!
	"""
	Affiliate/account-manager address.
	"""
	address: Bytes!
	"""
	Affiliate display name from registration/update events.
	"""
	name: String!
	"""
	Optional brand color from affiliate metadata events.
	"""
	brandColor: String
	"""
	Current affiliate admin address.
	"""
	admin: Bytes!
	"""
	Pending admin address while an admin transfer is proposed.
	"""
	pendingAdmin: Bytes
	"""
	Fee distributor address configured for this affiliate.
	"""
	feeDistributor: Bytes
	"""
	Latest affiliate lifecycle state such as PENDING, ACTIVE, or PAUSED.
	"""
	status: String!
	"""
	Affiliate Symmio fee-share read from AccountLayer after StakeholdersUpdated, in 1e18 precision where 1e18 is 100%; null until observed.
	"""
	symmioShare: BigInt
	"""
	Legacy ExpressRateSet value from older AccountLayer deployments; current perps-core retains this unused slot only for storage compatibility.
	"""
	expressRate: BigInt
	"""
	Legacy VirtualProviderSet address from older AccountLayer deployments; current perps-core retains this unused slot only for storage compatibility.
	"""
	virtualProvider: Bytes
	"""
	Deterministic AccountManager address emitted for this affiliate by historical deployments.
	"""
	accountManager: Bytes
	"""
	Whether a stakeholder update request is currently pending in the indexed event stream.
	"""
	stakeholdersUpdatePending: Boolean!
	"""
	AccountLayer contract address that emitted the affiliate event.
	"""
	source: Bytes!
	"""
	Block timestamp when this affiliate was first indexed.
	"""
	timestamp: BigInt!
	"""
	Block timestamp of the latest affiliate update.
	"""
	updateTimestamp: BigInt!
	"""
	Sub-accounts registered under this affiliate.
	"""
	subAccounts: [SubAccount!]! @derivedFrom(field: "affiliate")
	"""
	Nonzero fee-claim events recorded for this affiliate.
	"""
	feeClaims: [FeeClaim!]! @derivedFrom(field: "affiliate")
}
