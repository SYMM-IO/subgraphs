"""
Current indexed configuration for one Symmio trading symbol on one core contract.

The entity id is `${symbolId}-${coreAddress}`. Values are sourced from AddSymbol
and subsequent symbol-control events such as SetSymbolTradingFee,
SetSymbolFundingState, and SetSymbolValidationState.
"""
type Symbol @entity(immutable: false) {
	"""
	Composite symbol id `${symbolId}-${coreAddress}`.
	"""
	id: ID!
	"""
	Indexer ordering value assigned when the Symbol row is created.
	"""
	globalCounter: BigInt!
	"""
	Symbol name emitted by the core contract.
	"""
	name: String!
	"""
	Protocol symbol id on the Symmio core contract.
	"""
	symbolId: BigInt!
	"""
	Symmio core contract address for this symbol.
	"""
	source: Bytes!
	"""
	Default trading-fee rate for this symbol, stored with 1e18 precision in core.
	"""
	tradingFee: BigInt!
	"""
	Whether the core currently marks this symbol as valid for trading.
	"""
	isValid: Boolean!
	"""
	Value emitted by AddSymbol; current handlers do not refresh it after SetSymbolAcceptableValues.
	"""
	minAcceptableQuoteValue: BigInt
	"""
	Value emitted by AddSymbol; current handlers do not refresh it after SetSymbolAcceptableValues.
	"""
	minAcceptablePortionLF: BigInt
	"""
	Funding-rate epoch duration in seconds.
	"""
	fundingRateEpochDuration: BigInt
	"""
	Funding-rate application window in seconds; core requires it to be less than half the epoch duration.
	"""
	fundingRateWindowTime: BigInt
	"""
	Block timestamp when this symbol was first indexed.
	"""
	timestamp: BigInt!
	"""
	Block of AddSymbol or latest symbol-adjustment handler that explicitly rewrote it; ordinary fee/funding updates do not.
	"""
	blockNumber: BigInt!
	"""
	Block timestamp of the latest symbol event handled for this entity.
	"""
	updateTimestamp: BigInt!
	"""
	Raw SymbolAdjustmentStorage.AdjustmentState ordinal for the latest adjustment.
	"""
	adjustmentState: Int
	"""
	Zero-based index of the latest scheduled adjustment.
	"""
	adjustmentIndex: BigInt
	"""
	Latest scheduled price/quantity factor, scaled by 1e18.
	"""
	adjustmentFactor: BigInt
	"""
	Venue timestamp when the latest scheduled adjustment becomes effective.
	"""
	adjustmentEffectiveTimestamp: BigInt
	"""
	Confirmed cumulative factor that is active in Muon-facing price views.
	"""
	adjustmentCumulativeFactor: BigInt
	"""
	Latest physical quote-restatement epoch.
	"""
	restatementEpoch: BigInt
	"""
	Whether a quote-restatement maintenance window is currently open.
	"""
	restating: Boolean
	"""
	Whether the current restatement window has mutated a quote or pending inventory.
	"""
	restatementMutated: Boolean
	"""
	Factor selected for the current restatement window.
	"""
	restatementFactor: BigInt
	"""
	Timestamp from which the symbol has remained frozen for the current window.
	"""
	restatementStartedAt: BigInt
	"""
	Physical price/quantity basis version, incremented after each finalized restatement.
	"""
	basisVersion: BigInt
}
