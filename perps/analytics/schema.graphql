"""
Immutable balance-change event snapshot.

Rows are emitted from core balance events and enriched with account-layer
profile context when the account can be resolved. `isMarginTransferSideEffect`
marks balance changes caused by account-layer margin movement calls.
"""
type BalanceChange @entity(immutable: true) {
	"""
	Transaction-hash and log-index identifier for this balance change.
	"""
	id: ID!
	"""
	SYMMIO core contract that emitted this event.
	"""
	source: Bytes!
	"""
	Deployment identifier derived by the subgraph when available.
	"""
	deploymentId: String
	"""
	Resolved SYMMIO core associated with this balance event, when known.
	"""
	coreSource: Bytes
	"""
	AccountLayer contract associated with the resolved account hierarchy, when known.
	"""
	accountLayerSource: Bytes
	"""
	Handler-defined lifecycle category.
	"""
	type: String!
	"""
	PartyA/user account whose balance changed, or PartyB for a PartyB allocated-bucket change.
	"""
	account: Bytes!
	"""
	PartyA storage-bucket key from BalanceChangePartyB; zero denotes cross mode and null applies to other sources.
	"""
	sideAccount: Bytes
	"""
	Absolute event delta: Deposit/Withdraw use collateral-native units; allocation and protocol balance events use 18-decimal internal precision.
	"""
	amount: BigInt!
	"""
	ERC-20 collateral token dimension.
	"""
	collateral: Bytes!
	"""
	Resolved wallet owner for an account-layer profile, when known.
	"""
	owner: Bytes
	"""
	Account-layer SubAccount entity resolved for this balance change, when known.
	"""
	subAccountRef: SubAccount
	"""
	Account-layer VirtualAccount entity resolved for this balance change, when known.
	"""
	virtualAccountRef: VirtualAccount
	"""
	Subgraph account classification label when known.
	"""
	accountKind: String
	"""
	Result of subgraph calldata-selector and account-relationship heuristics; not an on-chain event flag.
	"""
	isMarginTransferSideEffect: Boolean!
	"""
	Heuristic margin movement kind: ADD, REMOVE, EMERGENCY_RECOVER, AUTO_RETURN, or null.
	"""
	marginTransferType: String
	"""
	Block timestamp of the balance-change event.
	"""
	timestamp: BigInt!
	"""
	Number of the block containing this event log.
	"""
	blockNumber: BigInt!
	"""
	Hash of the transaction containing this event log.
	"""
	transaction: Bytes!
	"""
	`sender` parameter from Deposit/Withdraw; null for BalanceChangePartyA/PartyB rows.
	"""
	sender: Bytes
	"""
	Account entity created or resolved for the Deposit/Withdraw sender.
	"""
	senderRef: Account
	"""
	Monotonic indexer-side ordering counter assigned when this row is created. Use for stable chronological sort across event sources.
	"""
	globalCounter: BigInt!
}

