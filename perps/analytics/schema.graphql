"""
Immutable tracked deposit into the SYMMIO BuyBack Gateway.
"""
type BuybackDeposit @entity(immutable: true) {
	"""
	Transaction-hash and log-index identifier for this deposit.
	"""
	id: ID!
	"""
	Subgraph-side monotonically increasing ordering id.
	"""
	counterId: BigInt!
	"""
	BuyBack Gateway proxy that received the deposit.
	"""
	gateway: Bytes!
	"""
	Account that transferred the funds into the gateway.
	"""
	depositor: Bytes!
	"""
	ERC-20 token deposited into the gateway.
	"""
	token: Bytes!
	"""
	Raw deposited token amount in the token's smallest unit.
	"""
	amount: BigInt!
	"""
	Human-readable attribution supplied to the gateway deposit call.
	"""
	depositSource: String!
	"""
	UTC day number computed as blockTimestamp divided by 86,400.
	"""
	dayId: BigInt!
	"""
	Number of the block containing this event log.
	"""
	blockNumber: BigInt!
	"""
	Block timestamp that included this deposit.
	"""
	blockTimestamp: BigInt!
	"""
	Transaction hash that emitted this deposit.
	"""
	transactionHash: Bytes!
	"""
	Transaction index within the block.
	"""
	transactionIndex: BigInt!
	"""
	Log index of this event within the transaction receipt.
	"""
	logIndex: BigInt!
	"""
	Block hash that included this deposit.
	"""
	blockHash: Bytes!
}

"""
Immutable V2 buyback executed by the SYMMIO BuyBack Gateway.
"""
type Buyback @entity(immutable: true) {
	"""
	Transaction-hash and log-index identifier for this buyback.
	"""
	id: ID!
	"""
	Subgraph-side monotonically increasing ordering id.
	"""
	counterId: BigInt!
	"""
	BuyBack Gateway proxy that executed the swap.
	"""
	gateway: Bytes!
	"""
	Operator that submitted the V2 buyback.
	"""
	operator: Bytes!
	"""
	ERC-20 token spent by the buyback when it can be resolved.
	"""
	inputToken: Bytes
	"""
	ERC-20 token bought by the buyback when it can be resolved.
	"""
	outputToken: Bytes
	"""
	DEX or aggregator contract called by the V2 buyback.
	"""
	callTarget: Bytes!
	"""
	Contract given the temporary input-token allowance by the V2 buyback.
	"""
	allowanceTarget: Bytes!
	"""
	Raw input-token amount spent in the swap.
	"""
	amountIn: BigInt!
	"""
	Operator-specified minimum output for the V2 buyback.
	"""
	minAmountOut: BigInt!
	"""
	Raw output-token amount purchased and settled.
	"""
	amountOut: BigInt!
	"""
	Settlement-mode ordinal: 0 for staking or 1 for burn.
	"""
	settlementMode: Int!
	"""
	Cumulative input spend for the contract's UTC day.
	"""
	dayTotal: BigInt!
	"""
	UTC day number computed as blockTimestamp divided by 86,400.
	"""
	dayId: BigInt!
	"""
	Number of the block containing this event log.
	"""
	blockNumber: BigInt!
	"""
	Block timestamp that included this buyback.
	"""
	blockTimestamp: BigInt!
	"""
	Transaction hash that emitted this buyback.
	"""
	transactionHash: Bytes!
	"""
	Transaction index within the block.
	"""
	transactionIndex: BigInt!
	"""
	Log index of this event within the transaction receipt.
	"""
	logIndex: BigInt!
	"""
	Block hash that included this buyback.
	"""
	blockHash: Bytes!
}

