"""
Per-day aggregate for a core/account-source bucket.

Trade volume is `openTradeVolume + closeTradeVolume + liquidateTradeVolume`.
`platformFee` is the aggregate of charged `openFee + closeFee` amounts; it does
not include funding, CVA, or liquidation-fee locked values.
"""
type DailyHistory @entity(immutable: false) {
	"""
	UTC-day-start milliseconds, SYMMIO core, and account-source addresses joined as the aggregate id.
	"""
	id: ID!
	"""
	SYMMIO core contract address that dimensions this aggregate.
	"""
	source: Bytes!
	"""
	UTC day bucket number used by daily aggregate helpers.
	"""
	day: BigInt!
	"""
	Number of quotes counted by this aggregate.
	"""
	quotesCount: BigInt!
	"""
	Sum of open, close, and liquidation notional volume for the day.
	"""
	tradeVolume: BigInt!
	"""
	Open notional added on OpenPosition, calculated as filledAmount * openedPrice / 1e18.
	"""
	openTradeVolume: BigInt!
	"""
	Close notional added on close handlers, calculated as filledAmount * closedPrice / 1e18.
	"""
	closeTradeVolume: BigInt!
	"""
	Liquidation notional added on liquidation handlers, calculated as amount * price / 1e18.
	"""
	liquidateTradeVolume: BigInt!
	"""
	Sum of raw Deposit amounts during this UTC day, in collateral-token native units.
	"""
	deposit: BigInt!
	"""
	Sum of raw Withdraw amounts during this UTC day, in collateral-token native units.
	"""
	withdraw: BigInt!
	"""
	Daily sum of AllocatePartyA amounts in 18-decimal internal collateral precision.
	"""
	allocate: BigInt!
	"""
	Daily sum of DeallocatePartyA amounts in 18-decimal internal collateral precision.
	"""
	deallocate: BigInt!
	"""
	Number of active users counted in this aggregate bucket.
	"""
	activeUsers: BigInt!
	"""
	Number of newly indexed users counted in this aggregate bucket.
	"""
	newUsers: BigInt!
	"""
	Number of newly indexed accounts counted in this aggregate bucket.
	"""
	newAccounts: BigInt!
	"""
	Charged platform fee amount, equal to openFee + closeFee.
	"""
	platformFee: BigInt!
	"""
	Actual charged open-fee amount, not the quote fee rate.
	"""
	openFee: BigInt!
	"""
	Actual charged close-fee amount, not the quote fee rate.
	"""
	closeFee: BigInt!
	"""
	Subgraph-derived Symmio share of platform fees, using fee collector state or fallback share.
	"""
	symmioShare: BigInt!
	"""
	Daily weighted-average open interest produced by open-interest settlement logic.
	"""
	openInterest: BigInt!
	"""
	Funding amount paid from the PartyA perspective.
	"""
	fundingPaid: BigInt!
	"""
	Funding amount received from the PartyA perspective.
	"""
	fundingReceived: BigInt!
	"""
	Average opened position size maintained by analytics handlers.
	"""
	averagePositionSize: BigInt!
	"""
	Number of positions counted by this aggregate.
	"""
	positionsCount: BigInt!
	"""
	Affiliate, MultiAccount, or AccountLayer attribution dimension; zero address is stored when unresolved.
	"""
	accountSource: Bytes
	"""
	Most recent event or open-interest processing timestamp assigned by a handler.
	"""
	updateTimestamp: BigInt!
	"""
	Timestamp supplied when this aggregate row was first created; neither bucket start nor latest update.
	"""
	timestamp: BigInt!
}

