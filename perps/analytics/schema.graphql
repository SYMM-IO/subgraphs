"""
Immutable subgraph-derived per-quote funding realization for core version 0.8.5+. Positive signed amounts are PartyA debits and negative amounts are PartyA credits; this direction does not by itself prove a direct balance transfer at the trigger event.
"""
type QuoteFundingSettlement @entity(immutable: true) {
	"""
	Composite ID `{transactionHash}-{logIndex}-{quoteId}`.
	"""
	id: ID!
	"""
	SYMMIO core address of the trigger event and quote/funding-state namespace.
	"""
	source: Bytes!
	"""
	Protocol quote id on the Symmio core contract.
	"""
	quoteId: BigInt!
	"""
	Reference to source-scoped Quote entity `{quoteId}-{source}`.
	"""
	quote: Quote!
	"""
	PartyA copied from Quote; signedAmount uses this party’s debit/credit perspective.
	"""
	partyA: Bytes!
	"""
	Quote PartyB/solver and PartyB dimension of symbol funding state.
	"""
	partyB: Bytes!
	"""
	Protocol market/symbol identifier dimension.
	"""
	symbolId: BigInt!
	"""
	Symbol name resolved from Symbol or core; empty string when resolution fails.
	"""
	symbolName: String!
	"""
	Raw Solidity PositionType ordinal: 0 LONG, 1 SHORT.
	"""
	positionType: Int!
	"""
	Funding realization path: EXPLICIT_CHARGE, FILL_CLOSE, FORCE_CLOSE, EMERGENCY_CLOSE, LIQUIDATE_PARTY_A, LIQUIDATE_PARTY_B, or LIQUIDATE_CLEARING_HOUSE.
	"""
	trigger: String!
	"""
	Pre-trigger remaining quantity, `quote.quantity − quote.closedAmount`, used in the funding calculation.
	"""
	openAmount: BigInt!
	"""
	Signed 1e18-scaled quote cumulative funding checkpoint captured before the trigger.
	"""
	previousAccumulatedPaidFunding: BigInt!
	"""
	Signed 1e18-scaled persisted Quote checkpoint after trigger; transient liquidation rows may leave it unchanged.
	"""
	newAccumulatedPaidFunding: BigInt!
	"""
	Signed 1e18-scaled per-unit delta; normally new minus previous, while transient liquidation derives it without updating Quote.
	"""
	fundingDeltaPerUnit: BigInt!
	"""
	Signed PartyA funding debit, `trunc(delta × openAmount / 1e18)`; positive means PartyA owes PartyB.
	"""
	signedAmount: BigInt!
	"""
	PartyA debit component, `max(signedAmount, 0)`; not proof of an immediate standalone transfer.
	"""
	paidByPartyA: BigInt!
	"""
	PartyA credit component, `max(-signedAmount, 0)`; not proof of an immediate standalone transfer.
	"""
	receivedByPartyA: BigInt!
	"""
	Previous quote lastFundingPaymentTimestamp before this settlement.
	"""
	previousLastFundingPaymentTimestamp: BigInt!
	"""
	New quote lastFundingPaymentTimestamp after this settlement.
	"""
	newLastFundingPaymentTimestamp: BigInt!
	"""
	Previous paid-through epoch value before this settlement when available.
	"""
	previousPaidThroughEpoch: BigInt
	"""
	New paid-through epoch value after this settlement when available.
	"""
	newPaidThroughEpoch: BigInt
	"""
	True when the normal path persisted the Quote checkpoint; false for transient liquidation. Not a balance-delta test.
	"""
	balanceChanged: Boolean!
	"""
	Block timestamp of the trigger event that produced this row.
	"""
	timestamp: BigInt!
	"""
	Block number of the trigger event that produced this row.
	"""
	blockNumber: BigInt!
	"""
	Transaction hash of the trigger event that produced this row.
	"""
	transaction: Bytes!
}
